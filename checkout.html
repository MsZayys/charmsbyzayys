<body>

<section class="checkout-page">

    <h1>Checkout</h1>

    <form id="checkout-form">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="03XXXXXXXXX" required>

        <label>Address</label>
        <textarea id="address" rows="4" placeholder="House No, Street, Area" required></textarea>
        <label>Bracelet Size</label>

<select id="measurement" required>

    <option value="">Select Bracelet Size</option>

    <option value="5.5 inch">5.5 inch</option>

    <option value="6 inch">6 inch</option>

    <option value="6.5 inch">6.5 inch</option>

    <option value="7 inch">7 inch</option>

    <option value="7.5 inch">7.5 inch</option>

    <option value="Custom">Custom Size</option>

</select>

<label id="customLabel" style="display:none;">
    Custom Measurement
</label>

<input
    type="text"
    id="customMeasurement"
    placeholder="Example: 6.3 inch"
    style="display:none;">

        <label>City</label>
        <input type="text" id="city" placeholder="Enter your city" required>

        <label>Payment Method</label>

        <select id="payment">

            <option>Cash on Delivery</option>
            <option>JazzCash</option>
            <option>EasyPaisa</option>

        </select>

        <button type="submit" class="shop-btn">

            Place Order

        </button>

    </form>

</section>
